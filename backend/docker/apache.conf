<VirtualHost *:${PORT}>
    DocumentRoot "/var/www/html/public"

    ProxyRequests Off
    ProxyPass "/app/" "http://127.0.0.1:18080/app/" upgrade=websocket timeout=75 retry=0
    ProxyPassReverse "/app/" "http://127.0.0.1:18080/app/"

    <Directory "/var/www/html/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
