[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/watchwise-supervisord.pid

[program:reverb]
command=/usr/local/bin/php artisan reverb:start --host=127.0.0.1 --port=18080 --no-interaction
directory=/var/www/html
user=www-data
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:apache]
command=/usr/local/bin/apache2-foreground
priority=20
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopsignal=WINCH
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
